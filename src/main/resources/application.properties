# Sistema ERP para la Gestion de Fabricacion y Comercializacion de Sofas
# ===================================================================
spring.application.name=sistema-erp-sofas
# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite (se crea sola en la carpeta del usuario: ~/.sistemaerpsofas/sofas.db)
app.db.dir=${user.home}/.sistemaerpsofas
spring.datasource.url=jdbc:sqlite:${app.db.dir}/sofas.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate (el esquema equivalente esta en db/schema.sql)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Registro de actividad
logging.level.root=WARN
logging.level.pe.erp.sofas=INFO

# Datos semilla del prototipo (solo se cargan si la base esta vacia)
app.seeder.enabled=true
# true: cualquier usuario ingresa (demo); false: valida con BCrypt contra la tabla usuario
app.auth.modo-prototipo=false
